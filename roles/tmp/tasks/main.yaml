---
- name: Look for /tmp in /etc/fstab
  ansible.builtin.command: findmnt --fstab --noheadings /tmp
  register: tmp_fstab
  changed_when: false
  failed_when: tmp_fstab.rc not in [0, 1]
  check_mode: false

- name: Assert /tmp is not an fstab mount
  ansible.builtin.assert:
    that: tmp_fstab.rc == 1
    fail_msg: /tmp is in /etc/fstab; remove the entry, tmp.mount replaces it

- name: Install the tmp.mount unit
  become: true
  ansible.builtin.template:
    src: tmp.mount.j2
    dest: /etc/systemd/system/tmp.mount
    mode: "0644"

- name: Check if systemd is running
  ansible.builtin.stat:
    path: /run/systemd/system
  register: tmp_systemd

- name: Enable tmp.mount
  when: tmp_systemd.stat.exists
  block:
    # Not started: mounting over the live /tmp hides sockets of running sessions
    - name: Enable tmp.mount for the next boot
      become: true
      ansible.builtin.systemd_service:
        name: tmp.mount
        enabled: true
        daemon_reload: true

    - name: Read the /tmp file system type
      ansible.builtin.command: findmnt --noheadings --output FSTYPE --target /tmp
      register: tmp_fstype
      changed_when: false
      check_mode: false

    - name: Request a reboot to mount tmpfs
      become: true
      ansible.builtin.file:
        path: /run/reboot-required
        state: touch
        mode: "0644"
        modification_time: preserve
        access_time: preserve
      when: tmp_fstype.stdout != 'tmpfs'
