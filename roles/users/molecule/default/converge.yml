---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Install AccountsService to exercise the user metadata path
      ansible.builtin.apt:
        name: accountsservice
        state: present

  roles:
    - role: users
      users_accounts:
        - name: molecule
          full_name: Molecule Tester
          email: molecule@example.com
        - name: plain
