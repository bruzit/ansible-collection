---
argument_specs:
  main:
    short_description: Ensure user accounts exist, with full name, email, GitHub SSH keys, an optional ed25519 key pair and sudo membership.
    options:
      users_accounts:
        type: list
        elements: dict
        default: []
        description:
          - Accounts to ensure. Keys used by this role are C(name) (required), C(full_name) (GECOS),
            C(email) (AccountsService, when installed), C(shell) (default C(/bin/bash)), C(github) (GitHub user whose
            public SSH keys are added to C(authorized_keys), other keys kept) and C(admin) (C(true) adds the account to
            C(sudo)).
          - Other keys are ignored, so the same list can be passed to other roles, such as C(git).
      users_ssh_key:
        type: bool
        default: false
        description:
          - Generate C(~/.ssh/id_ed25519) for every account, commented with C(email) when set.
          - An existing key is never overwritten.
