---
- name: Check if the system reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: system_reboot_required
  changed_when: system_reboot_required.stat.exists
  listen: Reboot system when required
  notify: Reboot system

- name: Reboot the system
  become: true
  ansible.builtin.reboot:
  when: system_reboot_when_needed
  listen: Reboot system

- name: Report reboot skipped
  become: true
  ansible.builtin.debug:
    msg: "Reboot skipped because `system_reboot_when_needed` is set to false"
  when: not system_reboot_when_needed
  listen: Reboot system
