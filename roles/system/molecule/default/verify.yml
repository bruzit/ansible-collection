---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Confirm /var/run/reboot-required is absent
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_attributes: false
        get_checksum: false
        get_mime: false
      register: sentinel_check

    - name: Fail if sentinel file appeared unexpectedly
      ansible.builtin.fail:
        msg: >
          /var/run/reboot-required was found but the scenario did not create it.
          Something outside the handler wrote the file.
      when: sentinel_check.stat.exists

    - name: Assert connectivity is healthy
      ansible.builtin.ping:
