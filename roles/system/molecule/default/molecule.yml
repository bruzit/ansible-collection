---
scenario:
  # The converge deliberately notifies the reboot handler via an
  # always-changed task to exercise the no-reboot path, so it can never
  # be idempotent. Skip molecule's idempotence step.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - cleanup
    - destroy
