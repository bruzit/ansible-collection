---
- name: Converge — no reboot required
  hosts: all
  become: true

  vars:
    reboot_when_needed: true

  pre_tasks:
    - name: Ensure /var/run/reboot-required is absent
      ansible.builtin.file:
        path: /var/run/reboot-required
        state: absent

  roles:
    - role: system

  tasks:
    - name: Simulate a task that requires a reboot
      ansible.builtin.debug:
        msg: >
          Notifying 'Reboot system when required'; the stat handler will find
          no sentinel file and will NOT chain-notify 'Reboot system'.
      changed_when: true
      notify: Reboot system when required
