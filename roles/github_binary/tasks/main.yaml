---
- name: Resolve the latest release of {{ github_binary_name }}
  ansible.builtin.uri:
    url: "https://github.com/{{ github_binary_repository }}/releases/latest"
    follow_redirects: none
    status_code: 302
  register: github_binary_latest
  until: github_binary_latest is succeeded
  retries: 3
  delay: 5
  check_mode: false
  when: github_binary_tag_prefix is undefined and github_binary_sums is defined

- name: Fetch the releases of {{ github_binary_name }}
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ github_binary_repository }}/releases{{ '' if github_binary_tag_prefix is defined else '/latest' }}"
    headers: "{{ {'Authorization': 'Bearer ' ~ github_binary_token} if github_binary_token else {} }}"
  register: github_binary_releases
  until: github_binary_releases is succeeded
  retries: 3
  delay: 5
  check_mode: false
  when: github_binary_latest is skipped

- name: Select the release of {{ github_binary_name }}
  ansible.builtin.set_fact:
    github_binary_release: >-
      {{ github_binary_releases.json | rejectattr('draft') | rejectattr('prerelease')
         | selectattr('tag_name', 'match', github_binary_tag_prefix | regex_escape) | first
         if github_binary_tag_prefix is defined else github_binary_releases.json }}
  when: github_binary_latest is skipped

- name: Set the version of {{ github_binary_name }}
  ansible.builtin.set_fact:
    github_binary_tag: "{{ github_binary_resolved_tag }}"
    github_binary_version: >-
      {{ github_binary_resolved_tag | regex_replace('^' ~ github_binary_tag_prefix | default('') | regex_escape, '') | regex_replace('^v', '') }}
  vars:
    github_binary_resolved_tag: >-
      {{ github_binary_release.tag_name if github_binary_latest is skipped else github_binary_latest.location | basename }}

- name: Set the download location of {{ github_binary_name }}
  ansible.builtin.set_fact:
    github_binary_url: >-
      {{ github_binary_download_url | default('https://github.com/' ~ github_binary_repository ~ '/releases/download/' ~ github_binary_tag) }}
    github_binary_asset_name: "{{ github_binary_asset | replace('{version}', github_binary_version) }}"
    github_binary_dir: "/tmp/{{ github_binary_name }}-{{ github_binary_tag }}"
    github_binary_download: "/tmp/{{ github_binary_name }}-{{ github_binary_tag }}-{{ github_binary_asset | replace('{version}', github_binary_version) }}"

- name: Check the installed version of {{ github_binary_name }}
  ansible.builtin.command: "{{ github_binary_version_command }}"
  register: github_binary_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install {{ github_binary_name }}
  when: github_binary_version not in github_binary_installed.stdout | default('')
  block:
    - name: Fetch the checksums of {{ github_binary_name }}
      ansible.builtin.uri:
        url: "{{ github_binary_url }}/{{ github_binary_sums | replace('{version}', github_binary_version) }}"
        return_content: true
      register: github_binary_sums_file
      until: github_binary_sums_file is succeeded
      retries: 3
      delay: 5
      check_mode: false
      when: github_binary_sums is defined

    - name: Extract the checksum of {{ github_binary_name }}
      ansible.builtin.set_fact:
        github_binary_checksum: "{{ github_binary_sums_file.content | regex_search(github_binary_sums_regex, '\\1', multiline=True) | first }}"
      when: github_binary_sums is defined

    - name: Take the release digest checksum of {{ github_binary_name }}
      ansible.builtin.set_fact:
        github_binary_checksum: >-
          {{ github_binary_release.assets | selectattr('name', '==', github_binary_asset_name) | map(attribute='digest')
             | first | default('', true) | regex_replace('^sha256:', '') }}
      when: github_binary_sums is undefined

    - name: Assert the checksum of {{ github_binary_name }}
      ansible.builtin.assert:
        that: github_binary_checksum is match('^[0-9a-f]{64}$')
        fail_msg: "No SHA-256 for {{ github_binary_asset_name }} in {{ github_binary_tag }}"
        quiet: true

    - name: Create the download directory of {{ github_binary_name }}
      ansible.builtin.file:
        path: "{{ github_binary_dir }}"
        state: directory
        mode: "0755"
      when: github_binary_member is defined

    - name: Download and verify the checksum of {{ github_binary_name }}
      ansible.builtin.get_url:
        url: "{{ github_binary_url }}/{{ github_binary_asset_name }}"
        # Outside github_binary_dir: in check mode get_url needs an existing dest directory.
        dest: "{{ github_binary_download }}"
        checksum: "sha256:{{ github_binary_checksum }}"
        mode: "0644"
      register: github_binary_downloaded
      until: github_binary_downloaded is succeeded
      retries: 3
      delay: 5

    - name: Install unzip for {{ github_binary_name }}
      become: true
      ansible.builtin.apt:
        name: unzip
        state: present
      when:
        - github_binary_member is defined
        - github_binary_asset_name.endswith('.zip')

    - name: Unpack {{ github_binary_name }}
      ansible.builtin.unarchive:
        src: "{{ github_binary_download }}"
        dest: "{{ github_binary_dir }}"
        remote_src: true
      when:
        - github_binary_member is defined
        - not ansible_check_mode

    - name: Install the binary of {{ github_binary_name }}
      become: true
      ansible.builtin.copy:
        src: "{{ github_binary_dir ~ '/' ~ github_binary_member if github_binary_member is defined else github_binary_download }}"
        dest: "/usr/local/bin/{{ github_binary_name }}"
        remote_src: true
        mode: "0755"
      when: not ansible_check_mode

    - name: Remove the downloads of {{ github_binary_name }}
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ github_binary_dir }}"
        - "{{ github_binary_download }}"
      when: not ansible_check_mode
