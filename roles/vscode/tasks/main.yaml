---
- name: Install python3-debian required by deb822_repository
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Add Visual Studio Code apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: vscode
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    architectures: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
  register: vscode_repository
  when: not ansible_check_mode

# Otherwise the code postinst rewrites vscode.sources and adds /usr/share/keyrings/microsoft.gpg.
- name: Keep the code package from managing its apt repository
  become: true
  ansible.builtin.debconf:
    name: code
    question: code/add-microsoft-repo
    vtype: boolean
    value: "false"

- name: Install Visual Studio Code
  become: true
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: "{{ vscode_repository is changed }}"
  when: not ansible_check_mode
