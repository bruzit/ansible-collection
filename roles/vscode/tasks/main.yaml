---
- name: Add Visual Studio Code apt repository
  ansible.builtin.include_role:
    name: bruzit.ansible.apt_source
  vars:
    apt_source_name: vscode
    apt_source_uris: https://packages.microsoft.com/repos/code
    apt_source_suites: stable
    apt_source_components: main
    apt_source_key_url: https://packages.microsoft.com/keys/microsoft.asc
    apt_source_fingerprint: "BC52 8686 B50D 79E3 39D3 721C EB3E 94AD BE12 29CF"

# Otherwise the code postinst rewrites vscode.sources and adds /usr/share/keyrings/microsoft.gpg.
- name: Keep the code package from managing its apt repository
  become: true
  ansible.builtin.debconf:
    name: code
    question: code/add-microsoft-repo
    vtype: boolean
    value: "false"

- name: Install Visual Studio Code
  become: true
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true
  when: not ansible_check_mode
