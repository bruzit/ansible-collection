---
- name: Gather service facts
  ansible.builtin.service_facts:
  listen: Restart WireGuard

- name: Restart wg-quick@wg0
  become: true
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    state: restarted
  when: ansible_facts.services['wg-quick@wg0.service'].state | default('') == 'running'
  listen: Restart WireGuard
