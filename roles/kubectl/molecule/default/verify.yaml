---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert kubectl is installed
      ansible.builtin.assert:
        that:
          - "'kubectl' in ansible_facts.packages"

    - name: Check kubectl is installed
      ansible.builtin.command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Assert kubectl output
      ansible.builtin.assert:
        that:
          - "'Client Version' in kubectl_version.stdout"

    - name: Check apt source file exists
      ansible.builtin.command: grep -rl pkgs.k8s.io /etc/apt/sources.list.d/
      register: kubectl_apt_source
      changed_when: false

    - name: Assert apt source file exists
      ansible.builtin.assert:
        that:
          - kubectl_apt_source.stdout | length > 0

    - name: Stat the bash completion of kubectl
      ansible.builtin.stat:
        path: /usr/share/bash-completion/completions/kubectl
      register: kubectl_completion

    - name: Assert the bash completion of kubectl is root-owned 0644
      ansible.builtin.assert:
        that:
          - kubectl_completion.stat.exists
          - kubectl_completion.stat.pw_name == 'root'
          - kubectl_completion.stat.mode == '0644'

    - name: Check the bash completion of kubectl registers
      ansible.builtin.command: bash -c '. /usr/share/bash-completion/completions/kubectl && complete -p kubectl'
      changed_when: false
