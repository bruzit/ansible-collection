---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert kubectl is installed
      ansible.builtin.assert:
        that:
          - "'kubectl' in ansible_facts.packages"

    - name: Check kubectl is installed
      ansible.builtin.command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Assert kubectl output
      ansible.builtin.assert:
        that:
          - "'Client Version' in kubectl_version.stdout"

    - name: Check apt source file exists
      ansible.builtin.command: grep -rl pkgs.k8s.io /etc/apt/sources.list.d/
      register: kubectl_apt_source
      changed_when: false

    - name: Assert apt source file exists
      ansible.builtin.assert:
        that:
          - kubectl_apt_source.stdout | length > 0
