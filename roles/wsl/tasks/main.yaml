---
- name: Read /etc/wsl.conf
  become: true
  ansible.builtin.slurp:
    src: /etc/wsl.conf
  register: wsl_conf
  failed_when: false
  when: wsl_dns_gateway

- name: Refuse to replace a foreign WSL boot command
  ansible.builtin.assert:
    that: >-
      (wsl_conf.content | default('') | b64decode | community.general.from_ini).get('boot', {}).get('command')
      in [None, '/usr/local/sbin/wsl-resolv-conf']
    fail_msg: "[boot] command in /etc/wsl.conf is not wsl-resolv-conf; remove it or set wsl_dns_gateway: false."
    quiet: true
  when: wsl_dns_gateway

- name: Configure /etc/wsl.conf
  become: true
  community.general.ini_file:
    path: /etc/wsl.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - { section: user, option: default, value: "{{ wsl_default_user }}" }
    - { section: boot, option: systemd, value: "false" }

- name: Install the resolv.conf writer
  become: true
  ansible.builtin.template:
    src: wsl-resolv-conf.j2
    dest: /usr/local/sbin/wsl-resolv-conf
    mode: "0755"
  register: wsl_dns_script
  when: wsl_dns_gateway

- name: Configure DNS via the NAT gateway in /etc/wsl.conf
  become: true
  community.general.ini_file:
    path: /etc/wsl.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    exclusive: "{{ wsl_dns_gateway }}"
    state: "{{ wsl_dns_gateway | ternary('present', 'absent') }}"
    mode: "0644"
  loop:
    - { section: network, option: generateResolvConf, value: "false" }
    - { section: boot, option: command, value: /usr/local/sbin/wsl-resolv-conf }

- name: Point /etc/resolv.conf at the NAT gateway
  become: true
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ ansible_facts.default_ipv4.gateway }}
      {% if wsl_dns_search %}
      search {{ wsl_dns_search | join(' ') }}
      {% endif %}
    follow: false
    mode: "0644"
  when:
    - wsl_dns_gateway
    - ansible_facts.default_ipv4.gateway is defined
    - not (ansible_check_mode and wsl_dns_script is changed)

- name: Remove the resolv.conf writer
  become: true
  ansible.builtin.file:
    path: /usr/local/sbin/wsl-resolv-conf
    state: absent
  when: not wsl_dns_gateway

- name: Create the needrestart drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    mode: "0755"

- name: Disable the needrestart kernel check
  become: true
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/wsl.conf
    content: "$nrconf{kernelhints} = 0;\n"
    mode: "0644"

- name: Purge snapd
  become: true
  ansible.builtin.apt:
    name: snapd
    state: absent
    purge: true

- name: Install xdg-utils
  become: true
  ansible.builtin.apt:
    name: xdg-utils
    state: present

# explorer.exe exits 1, cmd.exe /c start breaks on & in URLs
- name: Install the Windows browser wrapper
  become: true
  ansible.builtin.copy:
    dest: /usr/local/bin/wsl-browser
    content: |
      #!/bin/sh
      exec rundll32.exe url.dll,FileProtocolHandler "$1"
    mode: "0755"

- name: Select the Windows browser wrapper as browser alternative
  become: true
  community.general.alternatives:
    name: "{{ item }}"
    link: /usr/bin/{{ item }}
    path: /usr/local/bin/wsl-browser
  loop:
    - x-www-browser
    - www-browser
  when: not ansible_check_mode

- name: Export BROWSER for login shells
  become: true
  ansible.builtin.copy:
    dest: /etc/profile.d/wsl-browser.sh
    content: "export BROWSER=/usr/local/bin/wsl-browser\n"
    mode: "0644"
