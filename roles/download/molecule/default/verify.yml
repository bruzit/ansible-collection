---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Check ca-certificates is installed
      ansible.builtin.stat:
        path: /etc/ssl/certs
      register: download_ca_certificates
      failed_when: not download_ca_certificates.stat.exists

    - name: Check unzip is installed
      ansible.builtin.command: unzip -v  # noqa: command-instead-of-module
      register: download_unzip_version
      changed_when: false

    - name: Assert unzip output
      ansible.builtin.assert:
        that:
          - "'UnZip' in download_unzip_version.stdout"
