---
- name: Add Azure CLI apt repository
  ansible.builtin.include_role:
    name: bruzit.ansible.apt_source
  vars:
    apt_source_name: azure-cli
    apt_source_uris: https://packages.microsoft.com/repos/azure-cli/
    apt_source_suites: "{{ ansible_facts['distribution_release'] }}"
    apt_source_components: main
    apt_source_key_url: https://packages.microsoft.com/keys/microsoft.asc
    apt_source_fingerprint: "BC52 8686 B50D 79E3 39D3 721C EB3E 94AD BE12 29CF"

- name: Install Azure CLI
  become: true
  ansible.builtin.apt:
    name: azure-cli
    state: present
    update_cache: true
  when: not ansible_check_mode
