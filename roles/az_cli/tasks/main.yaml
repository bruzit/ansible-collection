---
- name: Install python3-debian required by deb822_repository
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Remove the legacy Azure CLI apt source
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/azure-cli.list
    state: absent

- name: Add Azure CLI apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: azure-cli
    uris: https://packages.microsoft.com/repos/azure-cli/
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
  when: not ansible_check_mode

- name: Install Azure CLI
  become: true
  ansible.builtin.apt:
    name: azure-cli
    state: present
    update_cache: true
  when: not ansible_check_mode
