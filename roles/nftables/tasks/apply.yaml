---
- name: Validate the nftables ruleset with all drop-ins
  become: true
  ansible.builtin.command: nft -c -f /etc/nftables.conf
  changed_when: false

- name: Apply the nftables ruleset
  become: true
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true

- name: Detect running systemd
  ansible.builtin.stat:
    path: /run/systemd/system
  register: nftables_apply_systemd

- name: Start nftables.service
  become: true
  ansible.builtin.systemd_service:
    name: nftables
    state: started
  when: nftables_apply_systemd.stat.exists
