---
- name: Validate the nftables ruleset with all drop-ins
  become: true
  ansible.builtin.command: nft -c -f /etc/nftables.conf
  changed_when: false

- name: Detect running systemd for the rollback
  ansible.builtin.stat:
    path: /run/systemd/system
  register: nftables_apply_systemd

- name: Schedule the rollback to the live ruleset
  when: nftables_rollback
  become: true
  block:
    - name: Snapshot the live bruzit table
      ansible.builtin.shell: >-
        { printf 'table inet bruzit\ndelete table inet bruzit\n'; nft list table inet bruzit || true; }
        >/run/bruzit-nftables-rollback.nft
      changed_when: false

    - name: Schedule the rollback timer
      ansible.builtin.command: >-
        systemd-run --unit=bruzit-nftables-rollback --collect
        --on-active={{ nftables_rollback_seconds }} --timer-property=RemainAfterElapse=no
        nft -f /run/bruzit-nftables-rollback.nft
      changed_when: true

- name: Apply the nftables ruleset
  become: true
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true

- name: Reconnect through the new ruleset
  ansible.builtin.meta: reset_connection

- name: Wait for a new connection
  ansible.builtin.wait_for_connection:
    timeout: "{{ nftables_rollback_seconds // 2 }}"

- name: Cancel the rollback
  when: nftables_rollback
  become: true
  block:
    - name: Read the rollback timer
      ansible.builtin.systemd_service:
        name: bruzit-nftables-rollback.timer
      register: nftables_rollback_timer
      failed_when: false

    - name: Assert the rollback has not run
      ansible.builtin.assert:
        that: nftables_rollback_timer.status.ActiveState | default('') == 'active'
        fail_msg: >-
          The rollback restored the previous ruleset; /etc/nftables.conf and /etc/nftables.d
          still hold the new one, which nftables.service loads at boot.
        quiet: true

    - name: Stop the rollback timer
      ansible.builtin.systemd_service:
        name: bruzit-nftables-rollback.timer
        state: stopped

- name: Start nftables.service
  become: true
  ansible.builtin.systemd_service:
    name: nftables
    state: started
  when: nftables_apply_systemd.stat.exists
