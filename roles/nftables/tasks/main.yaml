---
- name: Configure the nftables firewall
  when: nftables_enabled
  become: true
  block:
    - name: Assert the host is not WSL
      ansible.builtin.assert:
        that: "'microsoft' not in ansible_facts['kernel'] | lower"
        fail_msg: WSL is not supported; set nftables_enabled to false.
        quiet: true

    - name: Install nftables
      ansible.builtin.apt:
        name: nftables
        state: present
      register: nftables_package

    - name: Create the nftables directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/nftables.d
        - /etc/systemd/system/nftables.service.d

    - name: Configure the nftables ruleset
      ansible.builtin.template:
        src: nftables.conf.j2
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: "0755"
        validate: nft -c -f %s
      notify: Reload nftables

    # The packaged ExecStop flushes the whole ruleset, including Docker's tables
    - name: Keep other tables when nftables.service stops
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStop=
          ExecStop=-/usr/sbin/nft delete table inet bruzit
        dest: /etc/systemd/system/nftables.service.d/bruzit.conf
        owner: root
        group: root
        mode: "0644"

    - name: Detect running systemd
      ansible.builtin.stat:
        path: /run/systemd/system
      register: nftables_systemd

    - name: Enable nftables.service
      ansible.builtin.systemd_service:
        name: nftables
        enabled: true
        daemon_reload: true
      when: nftables_systemd.stat.exists and not (ansible_check_mode and nftables_package is changed)

    - name: Read the live nftables table
      ansible.builtin.command: nft list table inet bruzit
      register: nftables_live
      changed_when: nftables_live.rc != 0
      failed_when: false
      check_mode: false
      notify: Reload nftables
