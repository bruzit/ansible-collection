---
nftables_traffic_targets:
  host: {dev: nft-peer, ipv4: 192.0.2.1, ipv6: "fd51::1"}
  lo: {dev: lo, ipv4: 127.0.0.1, ipv6: "::1"}
  peer: {netns: peer, link: nft-peer, gateway: 192.0.2.1, ipv4: 192.0.2.2, ipv6: "fd51::2"}
  # Forward accepts the Docker bridges docker0 and br-*
  docker: {netns: docker, link: br-nft, gateway: 198.51.100.1, ipv4: 198.51.100.2}
  docker0: {netns: docker0, link: docker0, gateway: 198.18.0.1, ipv4: 198.18.0.2}
  routed: {netns: routed, link: nft-routed, gateway: 203.0.113.1, ipv4: 203.0.113.2}

# out: host to peer, in: peer to host, lo: host to itself, fwd: through the host;
# from (default peer) and to override the source and target namespaces
nftables_traffic_probes:
  - {direction: out, proto: icmp, family: ipv4, expect: pass}
  - {direction: out, proto: icmp, family: ipv6, expect: pass}
  - {direction: out, proto: udp, port: 53, family: ipv4, expect: pass}
  - {direction: out, proto: udp, port: 53, family: ipv6, expect: pass}
  - {direction: out, proto: udp, port: 67, family: ipv4, expect: pass}
  - {direction: out, proto: udp, port: 123, family: ipv4, expect: pass}
  - {direction: out, proto: udp, port: 123, family: ipv6, expect: pass}
  - {direction: out, proto: udp, port: 547, family: ipv6, expect: pass}
  - {direction: out, proto: tcp, port: 53, family: ipv4, expect: pass}
  - {direction: out, proto: tcp, port: 53, family: ipv6, expect: pass}
  - {direction: out, proto: tcp, port: 853, family: ipv4, expect: pass}
  - {direction: out, proto: tcp, port: 853, family: ipv6, expect: pass}
  - {direction: out, proto: tcp, port: 4460, family: ipv4, expect: pass}
  - {direction: out, proto: tcp, port: 4460, family: ipv6, expect: pass}
  - {direction: out, proto: tcp, port: 22, family: ipv4, expect: pass, rules: git}
  - {direction: out, proto: tcp, port: 22, family: ipv6, expect: pass, rules: git}
  - {direction: out, proto: tcp, port: 80, family: ipv4, expect: pass, rules: apt}
  - {direction: out, proto: tcp, port: 80, family: ipv6, expect: pass, rules: apt}
  - {direction: out, proto: tcp, port: 443, family: ipv4, expect: pass, rules: apt}
  - {direction: out, proto: tcp, port: 443, family: ipv6, expect: pass, rules: apt}
  - {direction: out, proto: tcp, port: 8080, family: ipv4, expect: drop}
  - {direction: out, proto: tcp, port: 8080, family: ipv6, expect: drop}
  # Allowed, but nothing listens there
  - {direction: out, proto: tcp, port: 853, family: ipv4, expect: refused, to: docker}
  - {direction: lo, proto: tcp, port: 8080, family: ipv4, expect: pass}
  - {direction: lo, proto: tcp, port: 8080, family: ipv6, expect: pass}
  - {direction: in, proto: icmp, family: ipv4, expect: pass}
  - {direction: in, proto: icmp, family: ipv6, expect: pass}
  - {direction: in, proto: udp, port: 68, family: ipv4, expect: pass, sport: 67}
  - {direction: in, proto: udp, port: 68, family: ipv4, expect: drop, sport: 1067}
  - {direction: in, proto: udp, port: 546, family: ipv6, expect: pass, sport: 547}
  - {direction: in, proto: tcp, port: 22, family: ipv4, expect: pass, rules: ssh_server}
  - {direction: in, proto: tcp, port: 22, family: ipv6, expect: pass, rules: ssh_server}
  - {direction: in, proto: tcp, port: 8080, family: ipv4, expect: drop}
  - {direction: in, proto: tcp, port: 8080, family: ipv6, expect: drop}
  - {direction: in, proto: udp, port: 8080, family: ipv4, expect: drop}
  - {direction: in, proto: udp, port: 8080, family: ipv6, expect: drop}
  - {direction: fwd, proto: tcp, port: 80, family: ipv4, expect: pass, to: docker}
  - {direction: fwd, proto: tcp, port: 80, family: ipv4, expect: drop, to: routed}
  - {direction: fwd, proto: tcp, port: 80, family: ipv4, expect: pass, from: docker, to: peer}
  - {direction: fwd, proto: tcp, port: 80, family: ipv4, expect: pass, to: docker0}
  - {direction: fwd, proto: tcp, port: 80, family: ipv4, expect: pass, from: docker0, to: peer}
