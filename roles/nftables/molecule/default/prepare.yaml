---
- name: Prepare
  ansible.builtin.import_playbook: ../../../../.config/molecule/prepare.yaml

- name: Load the stock inet filter table
  hosts: all
  gather_facts: false

  tasks:
    - name: Install nftables
      ansible.builtin.apt:
        name: nftables

    - name: Load the packaged ruleset without flushing others
      ansible.builtin.shell: set -o pipefail && sed '/^flush ruleset/d' /etc/nftables.conf | nft -f -
      args:
        executable: /bin/bash
      changed_when: true

    - name: Modify the stock table on ubuntu-24
      ansible.builtin.command: nft add rule inet filter input tcp dport 22 accept
      changed_when: true
      when: inventory_hostname == 'ubuntu-24'
