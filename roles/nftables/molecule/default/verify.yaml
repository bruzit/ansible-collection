---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Read the live table
      ansible.builtin.command: nft list table inet bruzit
      register: nftables_table
      changed_when: false

    - name: Read the inet filter table
      ansible.builtin.command: nft list table inet filter
      register: nftables_filter
      changed_when: false
      failed_when: false

    - name: Read the ruleset file
      ansible.builtin.slurp:
        src: /etc/nftables.conf
      register: nftables_conf

    - name: Read the nftables.service drop-in
      ansible.builtin.slurp:
        src: /etc/systemd/system/nftables.service.d/bruzit.conf
      register: nftables_unit

    - name: Assert the audit ruleset
      ansible.builtin.assert:
        that:
          - nftables_table.stdout is search('hook input priority filter; policy accept;')
          - nftables_table.stdout is search('hook output priority filter; policy accept;')
          - nftables_table.stdout is search('hook forward priority filter; policy accept;')
          - nftables_table.stdout is search('log prefix "bruzit-drop-out')
          - "'flush ruleset' not in (nftables_conf.content | b64decode)"
          - (nftables_conf.content | b64decode) is search('flush chain inet bruzit input')
          - "'ExecStop=-/usr/sbin/nft delete table inet bruzit' in (nftables_unit.content | b64decode)"

    - name: Assert the stock inet filter table is deleted and the modified one kept
      ansible.builtin.assert:
        that: >-
          nftables_filter.stdout is search('tcp dport 22 accept') if inventory_hostname == 'ubuntu-24'
          else nftables_filter.rc != 0

    - name: Assert the quiet ruleset drops without logging
      vars:
        nftables_quiet: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~ '/../../templates/nftables.conf.j2',
          template_vars={'nftables_mode': 'quiet'}) }}
      ansible.builtin.assert:
        that:
          - nftables_quiet is search('hook input priority filter; policy drop;')
          - nftables_quiet is search('hook output priority filter; policy drop;')
          - nftables_quiet is search('hook forward priority filter; policy drop;')
          - nftables_quiet is not search('log prefix')

    - name: Delete the live table
      ansible.builtin.command: nft delete table inet bruzit
      changed_when: true

    - name: Run on a WSL kernel
      ansible.builtin.include_role:
        name: nftables
      vars:
        ansible_facts: {kernel: 6.6.87.2-microsoft-standard-WSL2}

    - name: Apply the ruleset on a WSL kernel
      ansible.builtin.meta: flush_handlers

    - name: Read the live table on a WSL kernel
      ansible.builtin.command: nft list table inet bruzit
      register: nftables_wsl
      changed_when: false
      failed_when: false

    - name: Run on a WSL kernel when enabled
      ansible.builtin.include_role:
        name: nftables
      vars:
        ansible_facts: {kernel: 6.6.87.2-microsoft-standard-WSL2}
        nftables_enabled: true

    - name: Apply the ruleset on a WSL kernel when enabled
      ansible.builtin.meta: flush_handlers

    - name: Read the live table on a WSL kernel when enabled
      ansible.builtin.command: nft list table inet bruzit
      register: nftables_wsl_enabled
      changed_when: false
      failed_when: false

    - name: Assert WSL disables the firewall by default and nftables_enabled true opts in
      ansible.builtin.assert:
        that:
          - nftables_wsl.rc != 0
          - nftables_wsl_enabled.rc == 0
