---
argument_specs:
  main:
    short_description: Install Claude Code, latest, checksum verified, and deep-merge its user and project local settings.
    options:
      claude_settings:
        type: dict
        default: {}
        description:
          - Deep-merged into C(~/.claude/settings.json); lists are replaced, other keys kept.
      claude_default_agents_view:
        type: bool
        default: null
        description:
          - Sets C(defaultToAgentsView) in C(~/.claude.json) (global config, not C(settings.json)). Unset leaves it alone.
      claude_statusline_src:
        type: path
        default: null
        description:
          - Copied to C(~/.claude/statusline.sh) (mode C(0755)) and set as C(statusLine) command in C(~/.claude/settings.json). Unset leaves both alone.
          - Other C(statusLine) keys come from C(claude_settings).
          - The script needs C(jq) at run time.
      claude_local_settings:
        type: list
        elements: dict
        default: []
        description:
          - Deep-merged into C(<path>/.claude/settings.local.json) per project; lists are replaced, other keys kept.
        options:
          path:
            type: str
            required: true
            description: Project directory.
          settings:
            type: dict
            required: true
            description: Settings to merge.
