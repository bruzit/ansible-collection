---
- name: Install Node.js and npm from the Ubuntu archive
  become: true
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
  when: nodejs_major | length == 0

- name: Install Node.js from the NodeSource apt repository
  when: nodejs_major | length > 0
  become: true
  block:
    - name: Install python3-debian required by deb822_repository
      ansible.builtin.apt:
        name: python3-debian
        state: present

    - name: Add NodeSource apt repository
      ansible.builtin.deb822_repository:
        name: nodesource
        uris: "https://deb.nodesource.com/node_{{ nodejs_major }}.x"
        suites: nodistro
        components: main
        architectures: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
        signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
      when: not ansible_check_mode

    # Otherwise a newer Ubuntu archive nodejs, without bundled npm, wins over the requested major.
    - name: Prefer NodeSource nodejs over the Ubuntu archive
      ansible.builtin.copy:
        content: |
          Package: nodejs
          Pin: origin deb.nodesource.com
          Pin-Priority: 600
        dest: /etc/apt/preferences.d/nodesource
        mode: "0644"

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true
      when: not ansible_check_mode
