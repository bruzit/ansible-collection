---
- name: Install Node.js and npm from the Ubuntu archive
  become: true
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
  when: nodejs_major | length == 0

- name: Install Node.js from the NodeSource apt repository
  when: nodejs_major | length > 0
  become: true
  block:
    - name: Add NodeSource apt repository
      ansible.builtin.include_role:
        name: bruzit.ansible.apt_source
      vars:
        apt_source_name: nodesource
        apt_source_uris: "https://deb.nodesource.com/node_{{ nodejs_major }}.x"
        apt_source_suites: nodistro
        apt_source_components: main
        apt_source_key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        apt_source_fingerprint: "6F71 F525 2828 41EE DAF8 51B4 2F59 B5F9 9B1B E0B4"

    # Otherwise a newer Ubuntu archive nodejs, without bundled npm, wins over the requested major.
    - name: Prefer NodeSource nodejs over the Ubuntu archive
      ansible.builtin.copy:
        content: |
          Package: nodejs
          Pin: origin deb.nodesource.com
          Pin-Priority: 600
        dest: /etc/apt/preferences.d/nodesource
        mode: "0644"

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true
      when: not ansible_check_mode
