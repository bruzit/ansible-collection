---
- name: Check if systemd is running
  ansible.builtin.stat:
    path: /run/systemd/system
  register: grub_systemd
  listen: Update GRUB

# Skipped in containers: grub-mkconfig cannot probe their root device
- name: Regenerate the GRUB configuration
  become: true
  ansible.builtin.command: update-grub
  changed_when: true
  when: grub_systemd.stat.exists
  listen: Update GRUB
