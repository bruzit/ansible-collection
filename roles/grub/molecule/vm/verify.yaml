---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Read the generated GRUB configuration
      ansible.builtin.slurp:
        src: /boot/grub/grub.cfg
      register: grub_cfg

    - name: Assert the menu and both timeouts
      vars:
        grub_cfg_text: "{{ grub_cfg.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - grub_cfg_text is search('set timeout_style=menu')
          - grub_cfg_text is search('set timeout=10')
          - grub_cfg_text is not search('set timeout=30')
          - grub_cfg_text is search('linux\\s.*preempt=full')

    - name: Reboot through the menu timeout
      ansible.builtin.reboot:

    - name: Read the kernel command line
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: grub_proc_cmdline

    - name: Assert the extra kernel argument is active
      ansible.builtin.assert:
        that:
          - (grub_proc_cmdline.content | b64decode) is search('preempt=full')
