---
dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: false          # molecule connects only; QEMU is booted by CI script

platforms:
  - name: ubuntu-24
  - name: ubuntu-26

provisioner:
  name: ansible
  options:
    diff: true
  inventory:
    links:
      host_vars: ../../../../.github/molecule-vm-inventory/host_vars
  config_options:
    defaults:
      interpreter_python: auto_silent
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_ROLES_PATH: "../../.."

verifier:
  name: ansible
