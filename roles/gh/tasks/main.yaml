---
- name: Install GnuPG required by apt_repository
  become: true
  ansible.builtin.apt:
    name: gnupg
    state: present

- name: Install GitHub CLI signing key
  become: true
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"

- name: Add GitHub CLI apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli

- name: Install GitHub CLI
  become: true
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

- name: Install git
  become: true
  ansible.builtin.apt:
    name: git
    state: present

- name: Use gh as git credential helper per user
  become: true
  become_user: "{{ item.0.name }}"
  community.general.git_config:
    name: "credential.{{ item.1 }}.helper"
    scope: global
    value: "!/usr/bin/gh auth git-credential"
  loop: "{{ gh_users | product(['https://github.com', 'https://gist.github.com']) | list }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"
