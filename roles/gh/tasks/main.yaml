---
- name: Add GitHub CLI apt repository
  ansible.builtin.include_role:
    name: bruzit.ansible.apt_source
  vars:
    apt_source_name: github-cli
    apt_source_uris: https://cli.github.com/packages
    apt_source_suites: stable
    apt_source_components: main
    apt_source_key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    apt_source_fingerprint: "7F38 BBB5 9D06 4DBC B3D8 4D72 5612 B364 6231 3325"
    apt_source_legacy_keys:
      - /usr/share/keyrings/githubcli-archive-keyring.gpg
      - /etc/apt/keyrings/github-cli.gpg

- name: Install GitHub CLI
  become: true
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

- name: Install git
  become: true
  ansible.builtin.apt:
    name: git
    state: present

- name: Use gh as git credential helper per user
  become: true
  become_user: "{{ item.0.name }}"
  community.general.git_config:
    name: "credential.{{ item.1 }}.helper"
    scope: global
    value: "!/usr/bin/gh auth git-credential"
  loop: "{{ gh_users | product(['https://github.com', 'https://gist.github.com']) | list }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"
