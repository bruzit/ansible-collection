---
- name: Add Docker apt repository
  ansible.builtin.include_role:
    name: bruzit.ansible.apt_source
  vars:
    apt_source_name: docker
    apt_source_uris: https://download.docker.com/linux/ubuntu
    apt_source_suites: "{{ ansible_facts['distribution_release'] }}"
    apt_source_components: stable
    apt_source_key_url: https://download.docker.com/linux/ubuntu/gpg
    apt_source_fingerprint: "9DC8 5822 9FC7 DD38 854A E2D8 8D81 803C 0EBF CD88"
    apt_source_legacy_keys:
      - /usr/share/keyrings/docker.asc

- name: Install Docker
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
    update_cache: true

# service_mgr reports systemd once /sbin/init links to it, even when systemd is not PID 1 (WSL, containers)
- name: Detect running systemd
  ansible.builtin.stat:
    path: /run/systemd/system
  register: docker_systemd

- name: Enable and start Docker
  become: true
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: docker_systemd.stat.exists

- name: Add users to the docker group
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
