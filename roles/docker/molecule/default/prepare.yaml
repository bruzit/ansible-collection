---
- name: Prepare
  ansible.builtin.import_playbook: ../../../../.config/molecule/prepare.yaml

- name: Add the legacy Docker apt source
  hosts: all
  gather_facts: false

  tasks:
    - name: Create the legacy Docker apt source and key
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        - dest: /etc/apt/sources.list.d/docker.list
          content: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable\n"
        - dest: /usr/share/keyrings/docker.asc
          content: ""
      loop_control:
        label: "{{ item.dest }}"
