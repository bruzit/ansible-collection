---
- name: Check if systemd is running
  ansible.builtin.stat:
    path: /run/systemd/system
  register: nfs_client_systemd
  listen: Activate the NFS automounts

# Restart pulls in the automount units generated from fstab without contacting the server
- name: Restart remote-fs.target
  become: true
  ansible.builtin.systemd_service:
    name: remote-fs.target
    state: restarted
    daemon_reload: true
  when: nfs_client_systemd.stat.exists
  listen: Activate the NFS automounts
