---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Check helm runs
      ansible.builtin.command: helm version
      register: helm_version
      changed_when: false

    - name: Assert helm output
      ansible.builtin.assert:
        that:
          - "'Version:' in helm_version.stdout"

    - name: Stat the bash completion of helm
      ansible.builtin.stat:
        path: /usr/share/bash-completion/completions/helm
      register: helm_completion

    - name: Assert the bash completion of helm is root-owned 0644
      ansible.builtin.assert:
        that:
          - helm_completion.stat.exists
          - helm_completion.stat.pw_name == 'root'
          - helm_completion.stat.mode == '0644'

    - name: Check the bash completion of helm registers
      ansible.builtin.command: bash -c '. /usr/share/bash-completion/completions/helm && complete -p helm'
      changed_when: false
