---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Fetch the latest Nerd Fonts release
      ansible.builtin.uri:
        url: https://api.github.com/repos/ryanoasis/nerd-fonts/releases/latest
      register: nerd_font_release

    - name: Read the version marker
      ansible.builtin.slurp:
        src: /usr/local/share/fonts/JetBrainsMono/.version
      register: nerd_font_marker

    - name: Find the font files
      ansible.builtin.find:
        paths: /usr/local/share/fonts/JetBrainsMono
        patterns: "*.ttf"
      register: nerd_font_files

    - name: List the fonts known to fontconfig
      ansible.builtin.command: fc-list
      register: nerd_font_fc_list
      changed_when: false

    - name: Assert the font is installed
      ansible.builtin.assert:
        that:
          - nerd_font_files.matched > 0
          - "'JetBrainsMono Nerd Font' in nerd_font_fc_list.stdout"
          - nerd_font_marker.content | b64decode | trim == nerd_font_release.json.tag_name

    - name: Assert the Nerd Font Mono family is known to fontconfig
      ansible.builtin.assert:
        that: "'JetBrainsMono Nerd Font Mono' in nerd_font_fc_list.stdout"

    - name: Stat the Konsole files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: nerd_font_konsole_stat
      loop:
        - /usr/share/konsole/Nerd Font.profile
        - /etc/xdg/konsolerc

    - name: Assert the Konsole files belong to root
      ansible.builtin.assert:
        that:
          - nerd_font_konsole_stat.results | map(attribute='stat.pw_name') | unique == ['root']
          - nerd_font_konsole_stat.results | map(attribute='stat.gr_name') | unique == ['root']
          - nerd_font_konsole_stat.results | map(attribute='stat.mode') | unique == ['0644']

    - name: Read the Konsole profile
      ansible.builtin.slurp:
        src: /usr/share/konsole/Nerd Font.profile
      register: nerd_font_profile

    - name: Read the Konsole config
      ansible.builtin.slurp:
        src: /etc/xdg/konsolerc
      register: nerd_font_konsolerc

    - name: Assert the Konsole default profile uses the Nerd Font
      ansible.builtin.assert:
        that:
          - nerd_font_profile.content | b64decode is search('^\[General\]\nName=Nerd Font$', multiline=true)
          - >-
            nerd_font_profile.content | b64decode
            is search('^\[Appearance\]\nFont=JetBrainsMono Nerd Font Mono,11,-1,5,50,0,0,0,0,0$', multiline=true)
          - >-
            nerd_font_konsolerc.content | b64decode
            is search('^\[Desktop Entry\]\nDefaultProfile=Nerd Font.profile$', multiline=true)
