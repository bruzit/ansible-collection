---
platforms:
  - name: ubuntu-24
    image: docker.io/library/ubuntu:24.04
    pre_build_image: true

  - name: ubuntu-26
    image: docker.io/library/ubuntu:26.04
    pre_build_image: true

provisioner:
  playbooks:
    prepare: prepare.yaml

scenario:
  # First check runs on a fresh host, covering the install in check mode.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - check
    - side_effect
    - verify
    - cleanup
    - destroy
