---
argument_specs:
  main:
    short_description: Add one deb822 apt source whose signing key is verified against a pinned fingerprint.
    description:
      - The key is downloaded on every run; only the primary key with the pinned fingerprint, with its subkeys,
        is installed as C(/etc/apt/keyrings/<apt_source_name>.asc). Other primary keys in the download are dropped.
      - Fails when no primary key has the pinned fingerprint, or when it is expired or revoked.
      - Skipped in check mode, except installing C(gpg) and C(python3-debian).
    options:
      apt_source_name:
        type: str
        required: true
        description: Name of the C(/etc/apt/sources.list.d/<name>.sources) file and of the key in C(/etc/apt/keyrings).
      apt_source_uris:
        type: list
        elements: str
        required: true
        description: Repository URIs.
      apt_source_suites:
        type: list
        elements: str
        required: true
        description: Suites, e.g. the release codename, or C(/) for a flat repository.
      apt_source_components:
        type: list
        elements: str
        description: Components; unset for a flat repository.
      apt_source_key_url:
        type: str
        required: true
        description: URL of the vendor signing key, ASCII-armored or binary.
      apt_source_fingerprint:
        type: str
        required: true
        description: Full 40-hex fingerprint of the vendor's primary signing key; spaces and case are ignored.
      apt_source_legacy_keys:
        type: list
        elements: str
        description: Key files of a former setup, removed with C(/etc/apt/sources.list.d/<apt_source_name>.list).
