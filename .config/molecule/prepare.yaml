---
- name: Prepare
  hosts: all
  gather_facts: false

  tasks:
    - name: Install sudo, python3, python3-apt and bash-completion
      ansible.builtin.raw: >-
        dpkg --configure -a
        && timeout 300 apt-get -o Acquire::Retries=3 update
        && timeout 300 apt-get -o Acquire::Retries=3 install -y --download-only sudo python3 python3-apt bash-completion
        && apt-get install -y sudo python3 python3-apt bash-completion
      register: prepare_packages
      until: prepare_packages is succeeded
      retries: 2
      delay: 10
      changed_when: true
