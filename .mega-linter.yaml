---
ENABLE:
  - ACTION
  - ANSIBLE
  - MARKDOWN
  - YAML
ENABLE_LINTERS:
  - BASH_SHELLCHECK
BASH_SHELLCHECK_FILE_EXTENSIONS:
  - ""
  - .sh
  - .bash
ANSIBLE_ANSIBLE_LINT_PRE_COMMANDS:
  - command: ansible-galaxy collection install -r requirements.yaml
    cwd: workspace
    continue_if_failed: false
