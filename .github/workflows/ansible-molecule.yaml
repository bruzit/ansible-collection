name: Ansible Molecule Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  molecule-docker-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        role:
          - download
          - flatpak
          - gh
          - git
          - terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Install dependencies
        run: >
          pip install
          "ansible-core<2.19"
          molecule
          "molecule-plugins[docker]"
          docker

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yaml

      - name: Run Molecule
        working-directory: roles/${{ matrix.role }}
        run: molecule test

  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        role:
          - snap
          - system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable KVM access for runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU + cloud-init tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils cpu-checker
          kvm-ok || (echo "KVM not available" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Install Ansible and Molecule
        run: pip install "ansible-core<2.19" molecule

      - name: Cache Ansible collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yaml') }}

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yaml

      - name: Compute cache week
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache Ubuntu cloud images
        uses: actions/cache@v4
        with:
          path: |
            /tmp/molecule-vm/ubuntu-24.img
            /tmp/molecule-vm/ubuntu-26.img
          key: cloud-images-24-26-v1-${{ steps.cache-week.outputs.week }}

      - name: Boot VMs
        run: bash "$GITHUB_WORKSPACE/.github/scripts/molecule-vm-up.sh"

      - name: Run Molecule
        working-directory: roles/${{ matrix.role }}
        run: molecule test

      - name: Stop VMs
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/molecule-vm-down.sh"

      - name: Collect molecule artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molecule-${{ matrix.role }}-${{ github.run_id }}
          path: |
            ~/.cache/molecule/**/*.log
            /tmp/molecule-vm/*.log
          retention-days: 7
          if-no-files-found: ignore
