name: Ansible Molecule Test

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.check.outputs.run }}
      roles: ${{ steps.roles.outputs.roles }}
      vm_roles: ${{ steps.roles.outputs.vm_roles }}
    steps:
      - name: Skip push with open PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != main ] \
            && [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                    --jq '[.[] | select(.state == "open")] | length')" -gt 0 ]; then
            run=false
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed roles and dependants
        id: roles
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          VM_ROLES: '[{"role": "system", "scenario": "reboot"}]'
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="origin/$BASE_REF...HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null || [ "$GITHUB_REF_NAME" = main ]; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="origin/main...HEAD"
          fi
          roles=$(.github/scripts/molecule-roles "$range")
          vm_roles=$(jq -c --argjson r "$roles" 'map(select(.role | IN($r[])))' <<<"$VM_ROLES")
          printf 'roles=%s\nvm_roles=%s\n' "$roles" "$vm_roles" | tee -a "$GITHUB_OUTPUT"

  molecule-docker-driver:
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.roles != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        core: ["2.20", "2.21"]
        role: ${{ fromJSON(needs.gate.outputs.roles) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Install dependencies
        run: >
          pip install
          "ansible-core~=${{ matrix.core }}.0"
          molecule
          "molecule-plugins[docker]"
          docker

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yaml

      - name: Run Molecule
        working-directory: roles/${{ matrix.role }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: molecule test

  vm:
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.vm_roles != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        core: ["2.20", "2.21"]
        target: ${{ fromJSON(needs.gate.outputs.vm_roles) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable KVM access for runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU + cloud-init tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils cpu-checker
          kvm-ok || (echo "KVM not available" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Install Ansible and Molecule
        run: pip install "ansible-core~=${{ matrix.core }}.0" molecule "molecule-plugins[docker]"

      - name: Cache Ansible collections  # zizmor: ignore[cache-poisoning] written only by this repository's own runs; nothing is published
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yaml') }}

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yaml

      - name: Compute cache week
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache Ubuntu cloud images  # zizmor: ignore[cache-poisoning] written only by this repository's own runs; nothing is published
        uses: actions/cache@v6
        with:
          path: |
            /tmp/molecule-vm/ubuntu-22.img
            /tmp/molecule-vm/ubuntu-24.img
            /tmp/molecule-vm/ubuntu-26.img
          key: cloud-images-22-24-26-v1-${{ steps.cache-week.outputs.week }}

      - name: Boot VMs
        run: .github/scripts/molecule-vm-up

      - name: Run Molecule
        working-directory: roles/${{ matrix.target.role }}
        run: molecule test -s ${{ matrix.target.scenario }}

      - name: Stop VMs
        if: always()
        run: .github/scripts/molecule-vm-down

      - name: Collect molecule artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: molecule-${{ matrix.target.role }}-${{ matrix.core }}-${{ github.run_id }}
          path: |
            ~/.cache/molecule/**/*.log
            /tmp/molecule-vm/*.log
          retention-days: 7
          if-no-files-found: ignore
