name: Ansible Molecule Test

on:
  push:
  pull_request:

jobs:
  molecule-docker-driver:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        role:
          - download
          - git
          - terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6

      - name: Install dependencies
        run: >
          pip install
          "ansible-core<2.19"
          molecule
          molecule-docker
          docker

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule
        working-directory: roles/${{ matrix.role }}
        run: molecule test

  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        role:
          - system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable KVM access for runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU + cloud-init tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils cpu-checker
          kvm-ok || (echo "KVM not available" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          cache: pip

      - name: Install Ansible and Molecule
        run: pip install "ansible-core<2.19" molecule

      - name: Cache Ansible collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Cache Ubuntu cloud image
        uses: actions/cache@v4
        with:
          path: /tmp/molecule-vm/ubuntu-22.img
          key: cloud-image-server-22-v1

      - name: Boot VMs
        run: bash "$GITHUB_WORKSPACE/.github/scripts/molecule-vm-up.sh"

      - name: Run Molecule
        working-directory: roles/${{ matrix.role }}
        run: molecule test

      - name: Stop VMs
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/molecule-vm-down.sh"

      - name: Collect molecule artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molecule-${{ matrix.role }}-${{ github.run_id }}
          path: |
            ~/.cache/molecule/**/*.log
            /tmp/molecule-vm/*.log
          retention-days: 7
          if-no-files-found: ignore
